name: Fuxi builds

on:
  workflow_dispatch:
    inputs:
      kernel:
        description: Kernel/boot-argument profiles (current source, WLAN opt-in)
        type: choice
        options: [none, metal4, wlan6g, all]
        default: metal4
      metal:
        description: Signed FuxiMetal, smoke, own metallib and pinned metal2vulkan
        type: boolean
        default: false
      nativemetal:
        description: Opt-in NativeMetal port with Fuxi gate and fallback
        type: boolean
        default: false
      mesa:
        description: Pinned patched Turnip ICD with build recipes and patches
        type: boolean
        default: false
      tools:
        description: Signed Vulkan probe/smoke and GPU ABI test
        type: boolean
        default: false
      xcode16:
        description: Also rebuild the selected kernel(s) with a newer Xcode, replaying this run's Xcode 15 IIG output
        type: boolean
        default: false
      xcode16_runner:
        description: Runner for the xcode16 rebuild (macos-15 uses Xcode 16.4, macos-26 uses Xcode 26.6)
        type: choice
        options: [macos-15, macos-26]
        default: macos-15
      iig_cache:
        description: IIG source for the xcode16 rebuild; committed = tools/ci/iig-cache-xcode15 and no macos-14 build job (the route after macos-14 retires)
        type: choice
        options: [run, committed]
        default: run

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      kernels: ${{ steps.targets.outputs.kernels }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: targets
        env:
          KERNEL: ${{ inputs.kernel }}
          METAL: ${{ inputs.metal }}
          NATIVEMETAL: ${{ inputs.nativemetal }}
          MESA: ${{ inputs.mesa }}
          TOOLS: ${{ inputs.tools }}
          XCODE16: ${{ inputs.xcode16 }}
        run: |
          matrix=$(bash tools/ci/build.sh --plan "$KERNEL" "$METAL" "$MESA" "$TOOLS" "$NATIVEMETAL")
          kernels=$(jq -c '{target: [.target[] | select(startswith("kernel-"))]}' <<< "$matrix")
          if [[ $XCODE16 == true && $kernels == '{"target":[]}' ]]; then
            echo '::error::xcode16 rebuilds kernels only; select kernel=metal4, wlan6g or all'
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "kernels=$kernels" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    # Skipped when the xcode16 job replays the committed Xcode 15 IIG cache.
    if: ${{ inputs.iig_cache != 'committed' }}
    name: ${{ matrix.target }}
    # Xcode 15 iig matches XNU 8796's IORPC ABI; never silently use Xcode 16.
    # macos-14 retirement is tracked in xnu/README.md.
    runs-on: macos-14
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Download caches contain public source snapshots, text patches and GNU
      # Bison source only. Never cache KDKs, SDKs, build trees or research/.
      - uses: actions/cache@v4
        with:
          path: deps/ci-downloads
          key: fuxi-source-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('tools/ci/pins.env', 'tools/ci/build.sh') }}
      - uses: actions/cache@v4
        if: matrix.target == 'metal' || matrix.target == 'nativemetal'
        with:
          path: |
            ~/.cargo/registry
          key: fuxi-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ci/pins.env', 'tools/fuxi-metal2vulkan-bridge.rs', 'tools/build-fuxi-metal-translator.sh', 'tools/build-fuxi-nativemetal.py', 'tools/patches/nativemetal-fuxi-*.patch', 'tools/patches/metal2vulkan-adrenometal-*.patch') }}
      - name: Build selected target (no boot-image packing)
        run: bash tools/ci/build.sh "$TARGET"
      - name: Upload target outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-${{ matrix.target }}
          path: tools/out/ci/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7
      # Generated DriverKit sources from this Xcode 15 iig run (no kernel, SDK
      # or KDK), verified by build.sh. Feeds the xcode16 job; kept longer so a
      # cache made before macos-14 retirement can outlive the runner.
      - name: Upload Xcode 15 IIG cache
        if: success() && startsWith(matrix.target, 'kernel-')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: iig-cache-xcode15-${{ matrix.target }}
          path: tools/out/ci-iig/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 90

  # Optional proof of a kernel route without macos-14: a newer Xcode compiles
  # XNU, but iig is never run; tools/xnu-iig-cache.py replays the Xcode 15
  # output saved by the build job of this same run, and build.sh refuses to
  # package a kernel unless every generated file matches that cache.
  xcode16:
    needs: [plan, build]
    if: ${{ !cancelled() && inputs.xcode16 && needs.plan.result == 'success' }}
    name: ${{ matrix.target }} (${{ inputs.xcode16_runner == 'macos-26' && 'Xcode 26.6' || 'Xcode 16.4' }}, Xcode 15 IIG)
    runs-on: ${{ inputs.xcode16_runner == 'macos-26' && 'macos-26' || 'macos-15' }}
    # A trial: its failure must not fail the run (the Xcode 15 kernel is the product).
    continue-on-error: true
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.kernels) }}
    env:
      TARGET: ${{ matrix.target }}
      # Paths from the actions/runner-images macos-15-arm64 and macos-26-arm64 inventories.
      DEVELOPER_DIR: ${{ inputs.xcode16_runner == 'macos-26' && '/Applications/Xcode_26.6.app/Contents/Developer' || '/Applications/Xcode_16.4.app/Contents/Developer' }}
      ARTIFACT: fuxi-${{ matrix.target }}-${{ inputs.xcode16_runner == 'macos-26' && 'xcode26' || 'xcode16' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: deps/ci-downloads
          key: fuxi-source-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('tools/ci/pins.env', 'tools/ci/build.sh') }}
      - name: Download this run's Xcode 15 IIG cache
        if: ${{ inputs.iig_cache != 'committed' }}
        uses: actions/download-artifact@v4
        with:
          name: iig-cache-xcode15-${{ matrix.target }}
          path: deps/iig-cache-xcode15-${{ matrix.target }}
      - name: Build kernel with newer Xcode and replayed IIG (no boot-image packing)
        env:
          IIG: ${{ github.workspace }}/tools/xnu-iig-cache.py
          # Captured from the macos-14 Xcode 15.4 kernel job of run 40839814031 (commit 375f0c5);
          # no patch touches iokit/DriverKit, so it serves every later patch set.
          XNU_IIG_CACHE: ${{ inputs.iig_cache == 'committed' && format('{0}/tools/ci/iig-cache-xcode15', github.workspace) || format('{0}/deps/iig-cache-xcode15-{1}', github.workspace, matrix.target) }}
        run: bash tools/ci/build.sh "$TARGET"
      - name: Record toolchain and kernel hashes
        run: |
          {
            echo "### $ARTIFACT"
            echo '```'
            xcodebuild -version
            xcrun clang --version | head -1
            shasum -a 256 "tools/out/ci/$TARGET/kernel.development.fuxi" "tools/out/ci/$TARGET/kernel.development.fuxi.unstripped"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # A separate name: never replaces the Xcode 15 fuxi-<target> artifact.
      - name: Upload target outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: tools/out/ci/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7
